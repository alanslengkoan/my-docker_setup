services:
  mysqldb:
    container_name: my-mysql
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_USER: my_root
      MYSQL_PASSWORD: my_pass
      MYSQL_ROOT_PASSWORD: my_pass
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: my-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysqldb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: my_pass
    ports:
      - "8081:80"
    depends_on:
      - mysqldb
    networks:
      - mynetwork

  postgresdb:
    container_name: my-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: my_root
      POSTGRES_PASSWORD: my_pass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynetwork

  pgadmin:
    image: dpage/pgadmin4
    container_name: my-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: my_pass
    ports:
      - "8082:80"
    depends_on:
      - postgresdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  postgres_data: